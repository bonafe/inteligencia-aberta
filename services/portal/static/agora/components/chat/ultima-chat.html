<link rel="stylesheet" href="ultima-chat.css">
<div id="notice" role="note" hidden></div>
<div id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Mensagens do chat" tabindex="0"></div>
<form id="composer" autocomplete="off">
    <label class="sr-only" for="text">Escreva uma mensagem</label>
    <textarea id="text" rows="2" placeholder="Escreva uma mensagem… (Enter envia, Shift+Enter quebra a linha)" maxlength="4000"></textarea>
    <button id="send" type="submit">Enviar</button>
</form>
