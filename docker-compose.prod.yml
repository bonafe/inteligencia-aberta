# Produção: usar SEM o override de desenvolvimento (que o compose carregaria sozinho
# se não houvesse -f):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Host com domínio público (Caddy na frente), além disso:
#   ... --profile publico up -d --build
name: inteligencia-aberta

x-restart: &restart
  restart: unless-stopped

services:
  # Primeiro boot idempotente (migrations, buckets, superusuário inicial) como passo
  # único do compose: roda a cada `up`, termina e sai. Quem precisa do banco migrado
  # só sobe depois dele concluir com sucesso — a automação não tem passo manual.
  bootstrap:
    build: ./services/portal
    command: python manage.py bootstrap_instancia
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy

  portal:
    <<: *restart
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # BIND_ADDR padrão é loopback: nada fica exposto até o operador escolher.
    # Atrás de `tailscale serve` ou do Caddy, manter 127.0.0.1; sem proxy, o IP
    # da tailnet do host.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"

  orchestrator:
    <<: *restart
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8001"
    environment:
      # Vazio = nenhuma origem web (a extensão não depende de CORS). Ver main.py.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

  mcp:
    <<: *restart
    # Sem porta publicada: só o orchestrator o alcança, pela rede do compose.

  worker:
    <<: *restart
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}/fastembed-cache:/root/.cache/fastembed

  beat:
    <<: *restart
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  db:
    <<: *restart

  qdrant:
    <<: *restart

  redis:
    <<: *restart

  garage:
    <<: *restart

  # Só no host com IP público e domínio. Termina o TLS (Let's Encrypt) e publica
  # apenas o portal e /api/v1/capture/* — ver infra/caddy/Caddyfile.
  caddy:
    <<: *restart
    image: caddy:2-alpine
    profiles: ["publico"]
    depends_on:
      portal:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Obrigatórios com o profile publico (sem eles o Caddy não sobe); `:?` não serve
    # aqui porque o compose interpola mesmo com o profile desligado.
    environment:
      IA_DOMINIO: ${IA_DOMINIO:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy/data:/data
      - ${DATA_DIR:-./data}/caddy/config:/config
