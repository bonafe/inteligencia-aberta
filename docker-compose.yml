services:
  portal:
    build: ./services/portal
    # Sobe sob daphne (ASGI) — ver Dockerfile. O painel de eventos usa WebSocket,
    # que o servidor WSGI não atende.
    # Portas não são publicadas aqui: dev em docker-compose.override.yml, produção
    # em docker-compose.prod.yml (bind configurável por BIND_ADDR).
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # Ollama roda nativo no host (fora do Docker) para estruturação manual e
    # comparação. No Linux, host.docker.internal não resolve automaticamente
    # (diferente de Docker Desktop Mac/Windows) — precisa deste mapeamento.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    build: ./services/orchestrator
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build: ./services/mcp
    # /docs (Swagger) é publicado só em dev, para fins didáticos. As ferramentas
    # em si (/tools/*) exigem X-Mcp-Token — ver main.py.
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - ${DATA_DIR:-./data}/qdrant:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml
    healthcheck:
      # A imagem não tem curl/wget; abre o socket TCP com o próprio bash.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ./services/portal
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    env_file: .env
    # Ver comentário em `portal` — o worker é quem de fato chama o Ollama nativo
    # do host ao processar as tasks de estruturação manual/comparação.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build: ./services/portal
    command: celery -A config beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  redis:
    image: redis:7-alpine
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    # Armazenamento S3 compatível (substituiu o MinIO). Imagem própria porque a oficial
    # é distroless; o entrypoint cria layout, chave e buckets. Sem porta publicada em
    # prod: o S3 fica na rede interna (3900). Ver infra/garage/ e docs/deploy.md.
    build:
      context: ./infra/garage
      args:
        GARAGE_VERSION: ${GARAGE_VERSION:-v2.4.1}
    volumes:
      - ${DATA_DIR:-./data}/garage/meta:/var/lib/garage/meta
      - ${DATA_DIR:-./data}/garage/data:/var/lib/garage/data
    env_file: .env
    healthcheck:
      # O entrypoint cria /tmp/pronto só depois de layout, chave e buckets.
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
