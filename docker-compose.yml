services:
  portal:
    build: ./services/portal
    # Sobe sob daphne (ASGI) — ver Dockerfile. O painel de eventos usa WebSocket,
    # que o servidor WSGI não atende.
    # Portas não são publicadas aqui: dev em docker-compose.override.yml, produção
    # em docker-compose.prod.yml (bind configurável por BIND_ADDR).
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # Ollama nativo no host (modo "nativo", ADR 009) para estruturação manual e
    # comparação. No Linux, host.docker.internal não resolve automaticamente
    # (diferente de Docker Desktop Mac/Windows) — precisa deste mapeamento.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    build: ./services/orchestrator
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    build: ./services/mcp
    # /docs (Swagger) é publicado só em dev, para fins didáticos. As ferramentas
    # em si (/tools/*) exigem X-Mcp-Token — ver main.py.
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - ${DATA_DIR:-./data}/qdrant:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml
    healthcheck:
      # A imagem não tem curl/wget; abre o socket TCP com o próprio bash.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ./services/portal
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    env_file: .env
    # O volume do Ollama, só leitura, para medir o espaço livre dos modelos (a API do Ollama não informa disco).
    # Modo nativo: aponte OLLAMA_DATA_DIR_HOST para o ~/.ollama do host.
    volumes:
      - ${OLLAMA_DATA_DIR_HOST:-${DATA_DIR:-./data}/ollama}:/ollama-data:ro
    environment:
      OLLAMA_DATA_DIR_NA_PORTAL: /ollama-data
    # Ver comentário em `portal` — o worker é quem de fato chama o Ollama nativo
    # do host ao processar as tasks de estruturação manual/comparação.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Worker dedicado à instalação/remoção de modelos do Ollama (fila `ollama_admin`): um pull leva horas,
  # então não compete com o worker das extrações. Concorrência baixa de propósito.
  worker-ollama:
    build: ./services/portal
    command: celery -A config worker -l info -Q ollama_admin -c 2 -n ollama@%h
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ${OLLAMA_DATA_DIR_HOST:-${DATA_DIR:-./data}/ollama}:/ollama-data:ro
    environment:
      OLLAMA_DATA_DIR_NA_PORTAL: /ollama-data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build: ./services/portal
    command: celery -A config beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  redis:
    image: redis:7-alpine
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    # Armazenamento S3 compatível (substituiu o MinIO). Imagem própria porque a oficial
    # é distroless; o entrypoint cria layout, chave e buckets. Sem porta publicada em
    # prod: o S3 fica na rede interna (3900). Ver infra/garage/ e docs/deploy.md.
    build:
      context: ./infra/garage
      args:
        GARAGE_VERSION: ${GARAGE_VERSION:-v2.4.1}
    volumes:
      - ${DATA_DIR:-./data}/garage/meta:/var/lib/garage/meta
      - ${DATA_DIR:-./data}/garage/data:/var/lib/garage/data
    env_file: .env
    healthcheck:
      # O entrypoint cria /tmp/pronto só depois de layout, chave e buckets.
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Ollama como container: capacidade do nó, não da stack (ADR 009). Só sobe com
  # `COMPOSE_PROFILES=ollama` no .env (ou --profile ollama), junto com
  # OLLAMA_HOST=http://ollama:11434. Em Mac o Docker não acessa a GPU Metal: lá o
  # Ollama fica nativo. GPU NVIDIA no Linux: docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.35.1}
    profiles: ["ollama"]
    # Sem env_file de propósito: o servidor lê OLLAMA_HOST como endereço de bind, e o
    # do .env (http://ollama:11434, o que os clientes usam) o quebraria.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama
    # Loopback por padrão. Para o cluster alcançá-lo, OLLAMA_BIND_ADDR = IP da VPN
    # (o Ollama não tem autenticação — nunca 0.0.0.0).
    ports:
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:${OLLAMA_PORTA:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Baixa os modelos de OLLAMA_MODELOS (separados por espaço) e sai. Idempotente: o
  # que já está no volume não é baixado de novo. Vazio = não faz nada.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-0.35.1}
    profiles: ["ollama"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELOS: ${OLLAMA_MODELOS:-}
    entrypoint: ["sh", "-c", 'for m in $$OLLAMA_MODELOS; do ollama pull "$$m" || exit 1; done']
