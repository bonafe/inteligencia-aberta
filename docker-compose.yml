services:
  portal:
    build: ./services/portal
    # Sobe sob daphne (ASGI) — ver Dockerfile. O painel de eventos usa WebSocket,
    # que o servidor WSGI não atende.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    env_file: .env
    # Ollama roda nativo no host (fora do Docker) para estruturação manual e
    # comparação. No Linux, host.docker.internal não resolve automaticamente
    # (diferente de Docker Desktop Mac/Windows) — precisa deste mapeamento.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  orchestrator:
    build: ./services/orchestrator
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp:
        condition: service_started
    env_file: .env

  mcp:
    build: ./services/mcp
    # Publicado para expor /docs (Swagger) para fins didáticos. As ferramentas
    # em si (/tools/*) continuam exigindo X-Mcp-Token — ver main.py.
    ports:
      - "8002:8002"
    env_file: .env

  db:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml

  worker:
    build: ./services/portal
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file: .env
    # Ver comentário em `portal` — o worker é quem de fato chama o Ollama nativo
    # do host ao processar as tasks de estruturação manual/comparação.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build: ./services/portal
    command: celery -A config beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    env_file: .env
