# Overrides de desenvolvimento: volumes para hot-reload, sem restart policy
services:
  portal:
    ports:
      - "8000:8000"
    volumes:
      - ./services/portal:/app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      AGORA_SYNC_URL: ${AGORA_SYNC_URL:-ws://localhost:8787}
      AGORA_SYNC_ADMIN_URL: ${AGORA_SYNC_ADMIN_URL:-http://agora-sync:8787}
      AGORA_SYNC_ADMIN_TOKEN: ${AGORA_SYNC_ADMIN_TOKEN:-token-admin-apenas-para-dev}

  # Valores de desenvolvimento do Ultima Agora (NUNCA em produção): segredo fixo, igual nos dois lados.
  # O navegador fala com o agora-sync direto, na porta publicada.
  agora-sync:
    ports:
      - "8787:8787"
    environment:
      AGORA_SYNC_SECRET: ${AGORA_SYNC_SECRET:-inseguro-apenas-para-dev-agora-sync-0123456789}
      AGORA_SYNC_ADMIN_TOKEN: ${AGORA_SYNC_ADMIN_TOKEN:-token-admin-apenas-para-dev}

  orchestrator:
    ports:
      - "8001:8001"
    volumes:
      - ./services/orchestrator:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  mcp:
    ports:
      - "8002:8002"  # Swagger didático (/docs)
    volumes:
      - ./services/mcp:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  worker:
    volumes:
      - ./services/portal:/app
      - ${DATA_DIR:-./data}/fastembed-cache:/root/.cache/fastembed
    command: celery -A config worker -l info

  worker-ollama:
    volumes:
      - ./services/portal:/app
    command: celery -A config worker -l info -Q ollama_admin -c 2 -n ollama@%h

  beat:
    volumes:
      - ./services/portal:/app

  db:
    ports:
      - "5432:5432"

  garage:
    ports:
      - "3900:3900"  # API S3 (sem console)

  # Interface web da comunidade (khairul169/garage-webui) — o Garage não traz console.
  # Só em dev; precisa de GARAGE_ADMIN_TOKEN no .env.
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    depends_on:
      garage:
        condition: service_healthy
    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: us-east-1
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:-}
    ports:
      - "3909:3909"
